<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연산 게이트 러너 프로토타입</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="game-container" aria-label="연산 게이트 러너 게임 화면"></main>

    <script type="module">
      let sdk = null;
      try {
        const { createSDK } = await import('https://h5sdk.onestore.net/lib/v1.2.0/onestore-h5-sdk.min.js');
        sdk = createSDK();
      } catch (error) {
        console.warn('ONE store SDK load failed; starting in browser mode.', error);
      }

      const { bootGame } = await import('./js/bootstrap.js');
      await bootGame(sdk);
    </script>
  </body>
</html>
